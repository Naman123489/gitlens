[project]
name = "repolens-github"
version = "0.1.0"
description = "RepoLens GitHub integration: OAuth, REST client, safe repository fetching."
requires-python = ">=3.11"
dependencies = ["repolens-shared", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repolens_github*"]
