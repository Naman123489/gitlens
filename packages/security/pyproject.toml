[project]
name = "repolens-security"
version = "0.1.0"
description = "RepoLens static security analysis: secrets and injection patterns."
requires-python = ">=3.11"
dependencies = ["repolens-shared"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repolens_security*"]
