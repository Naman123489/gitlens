[project]
name = "repolens-analysis"
version = "0.1.0"
description = "RepoLens repository analysis engine: classification, AST, metrics, history."
requires-python = ">=3.11"
dependencies = ["repolens-shared", "tree-sitter>=0.23", "tree-sitter-language-pack>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repolens_analysis*"]
