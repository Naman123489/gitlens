[project]
name = "repolens-scoring"
version = "0.1.0"
description = "RepoLens job matching, evaluation policies and deterministic scoring."
requires-python = ">=3.11"
dependencies = ["repolens-shared"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repolens_scoring*"]
