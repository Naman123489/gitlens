[project]
name = "repolens-api"
version = "0.1.0"
description = "RepoLens API server."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "pyjwt>=2.8",
  "bcrypt>=4.1,<5",
  "redis>=5.0",
  "rq>=1.16",
  "httpx>=0.27",
  "structlog>=24.1",
  "pypdf>=4.2",
  "cryptography>=42.0",
  "email-validator>=2.1",
  "repolens-shared",
  "repolens-analysis",
  "repolens-github",
  "repolens-security",
  "repolens-similarity",
  "repolens-scoring",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
