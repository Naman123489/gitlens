# RepoLens local development environment.
#
#   docker compose up --build
#
# Brings up: PostgreSQL (with pgvector), Redis, the API, an analysis worker and
# the web app. Migrations run automatically before the API starts.
services:
  postgres:
    # pgvector/pgvector ships the `vector` extension, so the similarity engine
    # uses real ANN search here rather than the portable array fallback.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: repolens
      POSTGRES_PASSWORD: repolens
      POSTGRES_DB: repolens
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repolens -d repolens"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infrastructure/api.Dockerfile
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    environment:
      DATABASE_URL: postgresql+psycopg://repolens:repolens@postgres:5432/repolens
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/api/v1/auth/github/callback}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-insecure-encryption-key-change-me}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: infrastructure/api.Dockerfile
    command: ["python", "-m", "app.workers.run_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://repolens:repolens@postgres:5432/repolens
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-insecure-encryption-key-change-me}
      LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_started }
    # Analysis clones untrusted repositories. The worker therefore runs with a
    # read-only root filesystem, no privilege escalation and a writable tmpfs
    # that is the only place a clone can land.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=2g,mode=1777
    deploy:
      resources:
        limits:
          memory: 2g

  web:
    build:
      context: ./apps/web
      dockerfile: ../../infrastructure/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api: { condition: service_started }

volumes:
  postgres-data:
  redis-data:
